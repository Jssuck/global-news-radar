{% extends "base.html" %}
{% block title %}注册 · Global News Radar{% endblock %}
{% block content %}
<h1>注册</h1>
<div class="card" style="max-width:420px">
  <form id="reg-form">
    <p><label>邮箱<br><input name="email" type="email" required
      style="width:100%;padding:6px"></label></p>
    <p><label>密码（≥8 位）<br><input name="password" type="password" required
      minlength="8" style="width:100%;padding:6px"></label></p>
    <p><label>邀请码（可选）<br><input name="invite_code"
      style="width:100%;padding:6px"></label></p>
    <button type="submit">提交注册</button>
    <p class="muted" id="msg"></p>
  </form>
  <p class="muted">注册后需管理员审核通过方可登录。已有账号？<a href="/login">登录</a></p>
</div>
<script>
document.getElementById('reg-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = e.target;
  const r = await fetch('/api/v1/auth/register', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({email: f.email.value, password: f.password.value,
                          invite_code: f.invite_code.value || null})
  });
  const d = await r.json();
  document.getElementById('msg').textContent = r.ok
    ? '已提交，状态：' + d.status + '（pending 需管理员审核）'
    : (d.detail || '注册失败');
});
</script>
{% endblock %}
